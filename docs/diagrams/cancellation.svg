<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif"><title id="title">A423 cancellation swimlane</title><desc id="desc">Read columns left to right. Rows show who is responsible at each phase.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9baac0"/></marker></defs><rect width="1280" height="1050" fill="#f6f8fc"/>
<text x="48" y="33" font-size="14" fill="#2455c7" font-weight="700" data-max-width="1184">A423  /  PROTOCOL GUIDE</text>
<text x="48" y="79" font-size="34" fill="#172033" font-weight="700" data-max-width="1184">A423 cancellation swimlane</text>
<text x="48" y="116" font-size="19" fill="#536176" font-weight="400" data-max-width="1184">Read columns left to right. Rows show who is responsible at each phase.</text>
<rect x="208" y="163" width="249" height="67" rx="10" fill="#edf3ff" stroke="none"/>
<text x="223" y="203" font-size="22" fill="#172033" font-weight="700" data-max-width="219">1  Negotiate</text>
<rect x="465" y="163" width="249" height="67" rx="10" fill="#edf3ff" stroke="none"/>
<text x="480" y="203" font-size="22" fill="#172033" font-weight="700" data-max-width="219">2  Approve</text>
<rect x="722" y="163" width="249" height="67" rx="10" fill="#edf3ff" stroke="none"/>
<text x="737" y="203" font-size="22" fill="#172033" font-weight="700" data-max-width="219">3  Execute</text>
<rect x="979" y="163" width="249" height="67" rx="10" fill="#edf3ff" stroke="none"/>
<text x="994" y="203" font-size="22" fill="#172033" font-weight="700" data-max-width="219">4  Confirm</text>
<rect x="48" y="242" width="1184" height="141" rx="12" fill="white" stroke="#dbe3ee"/>
<rect x="48" y="242" width="148" height="141" rx="12" fill="#eaf0f8" stroke="none"/>
<text x="66" y="299" font-size="21" fill="#172033" font-weight="700" data-max-width="120">Payer +</text>
<text x="66" y="326" font-size="21" fill="#172033" font-weight="700" data-max-width="120">worker</text>
<text x="222" y="296" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Propose / counter split</text>
<text x="222" y="325" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Public work claims</text>
<line x1="461" y1="260" x2="461" y2="365" stroke="#dbe3ee"/>
<text x="479" y="296" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Both sign exact terms</text>
<text x="479" y="325" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Use current revision</text>
<line x1="718" y1="260" x2="718" y2="365" stroke="#dbe3ee"/>
<text x="736" y="296" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Authorize execution</text>
<text x="736" y="325" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Use saved instruction</text>
<line x1="975" y1="260" x2="975" y2="365" stroke="#dbe3ee"/>
<text x="993" y="296" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Review actual amounts</text>
<text x="993" y="325" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Check the fresh receipt</text>
<rect x="48" y="393" width="1184" height="141" rx="12" fill="white" stroke="#dbe3ee"/>
<rect x="48" y="393" width="148" height="141" rx="12" fill="#eaf0f8" stroke="none"/>
<text x="66" y="450" font-size="21" fill="#172033" font-weight="700" data-max-width="120">SDK</text>
<text x="66" y="477" font-size="21" fill="#172033" font-weight="700" data-max-width="120">backend</text>
<text x="222" y="447" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Freeze private costs *</text>
<text x="222" y="476" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Check caps and revision</text>
<line x1="461" y1="411" x2="461" y2="516" stroke="#dbe3ee"/>
<text x="479" y="447" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Verify signatures</text>
<text x="479" y="476" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Save accepted JSON</text>
<line x1="718" y1="411" x2="718" y2="516" stroke="#dbe3ee"/>
<text x="736" y="447" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Journal the signed call</text>
<text x="736" y="476" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Send and reconcile</text>
<line x1="975" y1="411" x2="975" y2="516" stroke="#dbe3ee"/>
<text x="993" y="447" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Validate chain evidence</text>
<text x="993" y="476" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Issue final receipt</text>
<rect x="48" y="544" width="1184" height="141" rx="12" fill="white" stroke="#dbe3ee"/>
<rect x="48" y="544" width="148" height="141" rx="12" fill="#fff6dc" stroke="none"/>
<text x="66" y="601" font-size="21" fill="#172033" font-weight="700" data-max-width="120">Escrow</text>
<text x="66" y="628" font-size="21" fill="#172033" font-weight="700" data-max-width="120">contract</text>
<text x="222" y="598" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Record proposal revision</text>
<text x="222" y="627" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Pause ordinary actions</text>
<line x1="461" y1="562" x2="461" y2="667" stroke="#dbe3ee"/>
<text x="479" y="598" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Funds remain locked</text>
<text x="479" y="627" font-size="18" fill="#536176" font-weight="400" data-max-width="221">JSON moves no funds</text>
<line x1="718" y1="562" x2="718" y2="667" stroke="#dbe3ee"/>
<text x="736" y="598" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Validate signed split</text>
<text x="736" y="627" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Transfer + emit events</text>
<line x1="975" y1="562" x2="975" y2="667" stroke="#dbe3ee"/>
<text x="993" y="598" font-size="18" fill="#536176" font-weight="400" data-max-width="221">Allocation recorded</text>
<text x="993" y="627" font-size="18" fill="#536176" font-weight="400" data-max-width="221">No second transfer</text>
<text x="48" y="740" font-size="15" fill="#536176" font-weight="700" data-max-width="1184">TWO DIFFERENT RECORDS</text>
<rect x="48" y="760" width="580" height="115" rx="12" fill="#fff6dc" stroke="#dbe3ee"/>
<text x="70" y="793" font-size="23" fill="#172033" font-weight="700" data-max-width="536">Accepted instruction</text>
<text x="70" y="826" font-size="18" fill="#536176" font-weight="400" data-max-width="536">A saved authorization record.</text>
<text x="70" y="851" font-size="18" fill="#536176" font-weight="400" data-max-width="536">It does not prove that funds moved.</text>
<rect x="652" y="760" width="580" height="115" rx="12" fill="#eaf8f0" stroke="#dbe3ee"/>
<text x="674" y="793" font-size="23" fill="#172033" font-weight="700" data-max-width="536">Confirmed final receipt</text>
<text x="674" y="826" font-size="18" fill="#536176" font-weight="400" data-max-width="536">Evidence of actual payout and refund.</text>
<text x="674" y="851" font-size="18" fill="#536176" font-weight="400" data-max-width="536">The closing ledger has zero locked funds.</text>
<text x="48" y="919" font-size="18" fill="#536176" font-weight="400" data-max-width="1184">Counteroffer: repeat negotiation with a new revision and fresh consent.</text>
<text x="48" y="949" font-size="18" fill="#536176" font-weight="400" data-max-width="1184">Disagreement: use supported arbitration or the original eligible deadline exit.</text>
<text x="48" y="979" font-size="18" fill="#536176" font-weight="400" data-max-width="1184">Pending / failed execution: no final payment receipt; reconcile or recover safely.</text>
<text x="48" y="1021" font-size="17" fill="#536176" font-weight="400" data-max-width="1184">* Profit policy is optional. Cost and margin calculations stay off-chain and private.</text>
</svg>
