<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif"><title id="title">A423 reopening rules</title><desc id="desc">Use a decision table, not a branching graph. Every path preserves the original history.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9baac0"/></marker></defs><rect width="1280" height="1050" fill="#f6f8fc"/>
<text x="48" y="33" font-size="14" fill="#2455c7" font-weight="700" data-max-width="1184">A423  /  PROTOCOL GUIDE</text>
<text x="48" y="79" font-size="34" fill="#172033" font-weight="700" data-max-width="1184">A423 reopening rules</text>
<text x="48" y="116" font-size="19" fill="#536176" font-weight="400" data-max-width="1184">Use a decision table, not a branching graph. Every path preserves the original history.</text>
<text x="48" y="159" font-size="15" fill="#536176" font-weight="700" data-max-width="1184">CHOOSE THE MATCHING RULE</text>
<rect x="48" y="181" width="1184" height="507" rx="12" fill="white" stroke="#dbe3ee"/>
<rect x="48" y="181" width="1184" height="52" rx="12" fill="#eaf0f8" stroke="none"/>
<text x="68" y="215" font-size="18" fill="#536176" font-weight="700" data-max-width="410">Current situation</text>
<text x="518" y="215" font-size="18" fill="#536176" font-weight="700" data-max-width="290">Required approval</text>
<text x="848" y="215" font-size="18" fill="#536176" font-weight="700" data-max-width="364">What happens next</text>
<line x1="48" y1="233" x2="1232" y2="233" stroke="#dbe3ee"/>
<text x="68" y="272" font-size="19" fill="#172033" font-weight="400" data-max-width="410">Funding attempted, or</text>
<text x="68" y="299" font-size="19" fill="#172033" font-weight="400" data-max-width="410">job already financially closed</text>
<text x="518" y="285.5" font-size="19" fill="#172033" font-weight="400" data-max-width="290">Not eligible for reopening</text>
<text x="848" y="272" font-size="19" fill="#172033" font-weight="600" data-max-width="364">Reconcile financial activity</text>
<text x="848" y="299" font-size="19" fill="#172033" font-weight="600" data-max-width="364">or create a new linked job.</text>
<rect x="49" y="324" width="1182" height="91" rx="0" fill="#fafbfd" stroke="none"/>
<line x1="48" y1="324" x2="1232" y2="324" stroke="#dbe3ee"/>
<text x="68" y="363" font-size="19" fill="#172033" font-weight="400" data-max-width="410">Requester cancelled before</text>
<text x="68" y="390" font-size="19" fill="#172033" font-weight="400" data-max-width="410">both parties had accepted</text>
<text x="518" y="376.5" font-size="19" fill="#172033" font-weight="400" data-max-width="290">Requester</text>
<text x="848" y="376.5" font-size="19" fill="#172033" font-weight="600" data-max-width="364">Reopen the same job ID.</text>
<line x1="48" y1="415" x2="1232" y2="415" stroke="#dbe3ee"/>
<text x="68" y="467.5" font-size="19" fill="#172033" font-weight="400" data-max-width="410">Worker declined the job</text>
<text x="518" y="467.5" font-size="19" fill="#172033" font-weight="400" data-max-width="290">Requester + worker</text>
<text x="848" y="467.5" font-size="19" fill="#172033" font-weight="600" data-max-width="364">Reopen the same job ID.</text>
<rect x="49" y="506" width="1182" height="91" rx="0" fill="#fafbfd" stroke="none"/>
<line x1="48" y1="506" x2="1232" y2="506" stroke="#dbe3ee"/>
<text x="68" y="545" font-size="19" fill="#172033" font-weight="400" data-max-width="410">Both had accepted before</text>
<text x="68" y="572" font-size="19" fill="#172033" font-weight="400" data-max-width="410">the job was cancelled</text>
<text x="518" y="558.5" font-size="19" fill="#172033" font-weight="400" data-max-width="290">Requester + worker</text>
<text x="848" y="558.5" font-size="19" fill="#172033" font-weight="600" data-max-width="364">Reopen the same job ID.</text>
<line x1="48" y1="597" x2="1232" y2="597" stroke="#dbe3ee"/>
<text x="68" y="636" font-size="19" fill="#172033" font-weight="400" data-max-width="410">Old cancelled record lacks</text>
<text x="68" y="663" font-size="19" fill="#172033" font-weight="400" data-max-width="410">a supported cancellation record</text>
<text x="518" y="649.5" font-size="19" fill="#172033" font-weight="400" data-max-width="290">No automatic reopening</text>
<text x="848" y="636" font-size="19" fill="#172033" font-weight="600" data-max-width="364">Keep the historical record</text>
<text x="848" y="663" font-size="19" fill="#172033" font-weight="600" data-max-width="364">terminal; review migration.</text>
<text x="48" y="744" font-size="15" fill="#536176" font-weight="700" data-max-width="1184">AFTER ALL REQUIRED APPROVALS</text>
<rect x="48" y="765" width="278" height="141" rx="12" fill="#eaf8f0" stroke="#dbe3ee"/>
<rect x="68" y="785" width="5" height="28" rx="2" fill="#19724c" stroke="#19724c"/>
<text x="86" y="808" font-size="22" fill="#172033" font-weight="700" data-max-width="220">Keep the ID</text>
<text x="68" y="842" font-size="19" fill="#536176" font-weight="400" data-max-width="238">Preserve job history</text>
<text x="68" y="869" font-size="19" fill="#536176" font-weight="400" data-max-width="238">Keep past records.</text>
<rect x="350" y="765" width="278" height="141" rx="12" fill="#eaf8f0" stroke="#dbe3ee"/>
<rect x="370" y="785" width="5" height="28" rx="2" fill="#19724c" stroke="#19724c"/>
<text x="388" y="808" font-size="22" fill="#172033" font-weight="700" data-max-width="220">New generation</text>
<text x="370" y="842" font-size="19" fill="#536176" font-weight="400" data-max-width="238">Increment epoch.</text>
<text x="370" y="869" font-size="19" fill="#536176" font-weight="400" data-max-width="238">Clear active agreement.</text>
<rect x="652" y="765" width="278" height="141" rx="12" fill="#eaf8f0" stroke="#dbe3ee"/>
<rect x="672" y="785" width="5" height="28" rx="2" fill="#19724c" stroke="#19724c"/>
<text x="690" y="808" font-size="22" fill="#172033" font-weight="700" data-max-width="220">Fresh quote</text>
<text x="672" y="842" font-size="19" fill="#536176" font-weight="400" data-max-width="238">Use a higher revision</text>
<text x="672" y="869" font-size="19" fill="#536176" font-weight="400" data-max-width="238">New agreement hash.</text>
<rect x="954" y="765" width="278" height="141" rx="12" fill="#eaf8f0" stroke="#dbe3ee"/>
<rect x="974" y="785" width="5" height="28" rx="2" fill="#19724c" stroke="#19724c"/>
<text x="992" y="808" font-size="22" fill="#172033" font-weight="700" data-max-width="220">Both accept</text>
<text x="974" y="842" font-size="19" fill="#536176" font-weight="400" data-max-width="238">Collect new approvals.</text>
<text x="974" y="869" font-size="19" fill="#536176" font-weight="400" data-max-width="238">Never restore old ones.</text>
<line x1="331" y1="835" x2="345" y2="835" stroke="#9baac0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="633" y1="835" x2="647" y2="835" stroke="#9baac0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="935" y1="835" x2="949" y2="835" stroke="#9baac0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="963" font-size="18" fill="#536176" font-weight="400" data-max-width="1184">Reopen using the exact cancellation_id. No reopening after payout, refund or settlement.</text>
<text x="48" y="994" font-size="18" fill="#536176" font-weight="400" data-max-width="1184">After reopening, quote / accept / fund / cancel / decline must use the current expected_epoch.</text>
</svg>
