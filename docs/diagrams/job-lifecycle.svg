<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1240" viewBox="0 0 1280 1240" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif"><title id="title">A423 job process</title><desc id="desc">Read the primary path left to right. Exceptions are listed separately below.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9baac0"/></marker></defs><rect width="1280" height="1240" fill="#f6f8fc"/>
<text x="48" y="33" font-size="14" fill="#2455c7" font-weight="700" data-max-width="1184">A423  /  PROTOCOL GUIDE</text>
<text x="48" y="79" font-size="34" fill="#172033" font-weight="700" data-max-width="1184">A423 job process</text>
<text x="48" y="116" font-size="19" fill="#536176" font-weight="400" data-max-width="1184">Read the primary path left to right. Exceptions are listed separately below.</text>
<text x="48" y="159" font-size="15" fill="#536176" font-weight="700" data-max-width="1184">PRIMARY PATH</text>
<rect x="48" y="180" width="278" height="282" rx="12" fill="#edf3ff" stroke="#dbe3ee"/>
<text x="68" y="214" font-size="16" fill="#2455c7" font-weight="700" data-max-width="50">01</text>
<text x="68" y="248" font-size="24" fill="#172033" font-weight="700" data-max-width="238">Agreement</text>
<text x="68" y="291" font-size="21" fill="#2455c7" font-weight="600" data-max-width="238">draft</text>
<text x="68" y="321" font-size="21" fill="#2455c7" font-weight="600" data-max-width="238">quoted</text>
<text x="68" y="351" font-size="21" fill="#2455c7" font-weight="600" data-max-width="238">accepted</text>
<text x="68" y="391" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Both parties approve</text>
<text x="68" y="415" font-size="18" fill="#536176" font-weight="400" data-max-width="238">the exact revision</text>
<text x="68" y="439" font-size="18" fill="#536176" font-weight="400" data-max-width="238">and agreement hash.</text>
<line x1="331" y1="322" x2="345" y2="322" stroke="#9baac0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="180" width="278" height="282" rx="12" fill="#fff6dc" stroke="#dbe3ee"/>
<text x="370" y="214" font-size="16" fill="#936100" font-weight="700" data-max-width="50">02</text>
<text x="370" y="248" font-size="24" fill="#172033" font-weight="700" data-max-width="238">Funding</text>
<text x="370" y="291" font-size="21" fill="#936100" font-weight="600" data-max-width="238">funded</text>
<text x="370" y="391" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Worker wallet consents.</text>
<text x="370" y="415" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Payer authorizes funding.</text>
<text x="370" y="439" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Confirm on-chain custody.</text>
<line x1="633" y1="322" x2="647" y2="322" stroke="#9baac0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="652" y="180" width="278" height="282" rx="12" fill="#f3edff" stroke="#dbe3ee"/>
<text x="672" y="214" font-size="16" fill="#6940b3" font-weight="700" data-max-width="50">03</text>
<text x="672" y="248" font-size="24" fill="#172033" font-weight="700" data-max-width="238">Delivery</text>
<text x="672" y="291" font-size="21" fill="#6940b3" font-weight="600" data-max-width="238">running</text>
<text x="672" y="321" font-size="21" fill="#6940b3" font-weight="600" data-max-width="238">submitted</text>
<text x="672" y="351" font-size="21" fill="#6940b3" font-weight="600" data-max-width="238">verified</text>
<text x="672" y="391" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Run the task.</text>
<text x="672" y="415" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Commit the artifact.</text>
<text x="672" y="439" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Validate the result.</text>
<line x1="935" y1="322" x2="949" y2="322" stroke="#9baac0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="954" y="180" width="278" height="282" rx="12" fill="#eaf8f0" stroke="#dbe3ee"/>
<text x="974" y="214" font-size="16" fill="#19724c" font-weight="700" data-max-width="50">04</text>
<text x="974" y="248" font-size="24" fill="#172033" font-weight="700" data-max-width="238">Payment</text>
<text x="974" y="291" font-size="21" fill="#19724c" font-weight="600" data-max-width="238">paid</text>
<text x="974" y="391" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Verifier releases funds.</text>
<text x="974" y="415" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Confirm worker payout.</text>
<text x="974" y="439" font-size="18" fill="#536176" font-weight="400" data-max-width="238">Read a fresh receipt.</text>
<text x="48" y="512" font-size="15" fill="#536176" font-weight="700" data-max-width="1184">EXCEPTIONS AND ALTERNATIVE ROUTES</text>
<rect x="48" y="534" width="1184" height="584" rx="12" fill="white" stroke="#dbe3ee"/>
<rect x="48" y="534" width="1184" height="52" rx="12" fill="#eaf0f8" stroke="none"/>
<text x="68" y="568" font-size="18" fill="#536176" font-weight="700" data-max-width="340">When</text>
<text x="448" y="568" font-size="18" fill="#536176" font-weight="700" data-max-width="374">Action</text>
<text x="862" y="568" font-size="18" fill="#536176" font-weight="700" data-max-width="350">Resulting state</text>
<line x1="48" y1="586" x2="1232" y2="586" stroke="#dbe3ee"/>
<text x="68" y="631" font-size="19" fill="#172033" font-weight="400" data-max-width="340">Before a funding attempt</text>
<text x="448" y="631" font-size="19" fill="#172033" font-weight="400" data-max-width="374">Cancel or decline</text>
<text x="862" y="631" font-size="19" fill="#172033" font-weight="600" data-max-width="350">cancelled; history retained</text>
<rect x="49" y="662" width="1182" height="76" rx="0" fill="#fafbfd" stroke="none"/>
<line x1="48" y1="662" x2="1232" y2="662" stroke="#dbe3ee"/>
<text x="68" y="707" font-size="19" fill="#172033" font-weight="400" data-max-width="340">Eligible cancelled job</text>
<text x="448" y="707" font-size="19" fill="#172033" font-weight="400" data-max-width="374">Collect reopening approvals</text>
<text x="862" y="707" font-size="19" fill="#172033" font-weight="600" data-max-width="350">draft; fresh generation</text>
<line x1="48" y1="738" x2="1232" y2="738" stroke="#dbe3ee"/>
<text x="68" y="783" font-size="19" fill="#172033" font-weight="400" data-max-width="340">After funding; need to stop</text>
<text x="448" y="783" font-size="19" fill="#172033" font-weight="400" data-max-width="374">Propose a closing split</text>
<text x="862" y="783" font-size="19" fill="#172033" font-weight="600" data-max-width="350">settlement_negotiation</text>
<rect x="49" y="814" width="1182" height="76" rx="0" fill="#fafbfd" stroke="none"/>
<line x1="48" y1="814" x2="1232" y2="814" stroke="#dbe3ee"/>
<text x="68" y="859" font-size="19" fill="#172033" font-weight="400" data-max-width="340">Unsubmitted and expired</text>
<text x="448" y="859" font-size="19" fill="#172033" font-weight="400" data-max-width="374">Execute an eligible refund</text>
<text x="862" y="859" font-size="19" fill="#172033" font-weight="600" data-max-width="350">refunded or settled *</text>
<line x1="48" y1="890" x2="1232" y2="890" stroke="#dbe3ee"/>
<text x="68" y="935" font-size="19" fill="#172033" font-weight="400" data-max-width="340">Disagreement after funding</text>
<text x="448" y="935" font-size="19" fill="#172033" font-weight="400" data-max-width="374">Dispute, then resolve</text>
<text x="862" y="935" font-size="19" fill="#172033" font-weight="600" data-max-width="350">disputed, then settled</text>
<rect x="49" y="966" width="1182" height="76" rx="0" fill="#fafbfd" stroke="none"/>
<line x1="48" y1="966" x2="1232" y2="966" stroke="#dbe3ee"/>
<text x="68" y="1011" font-size="19" fill="#172033" font-weight="400" data-max-width="340">Submitted; timeout eligible</text>
<text x="448" y="1011" font-size="19" fill="#172033" font-weight="400" data-max-width="374">Execute agreed timeout</text>
<text x="862" y="1011" font-size="19" fill="#172033" font-weight="600" data-max-width="350">settled; actual allocation</text>
<line x1="48" y1="1042" x2="1232" y2="1042" stroke="#dbe3ee"/>
<text x="68" y="1087" font-size="19" fill="#172033" font-weight="400" data-max-width="340">Unfunded terms expired</text>
<text x="448" y="1087" font-size="19" fill="#172033" font-weight="400" data-max-width="374">expire, if configured</text>
<text x="862" y="1087" font-size="19" fill="#172033" font-weight="600" data-max-width="350">expired</text>
<text x="48" y="1171" font-size="17" fill="#536176" font-weight="400" data-max-width="1184">Financial states require confirmed chain evidence; pending is not a completed payment.</text>
<text x="48" y="1198" font-size="17" fill="#536176" font-weight="400" data-max-width="1184">* The parent state depends on whether refund or timeout was used for the expiry exit.</text>
</svg>
